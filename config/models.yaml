schema_version: 1
# Canonical local models. Every `model:` value must match an exact installed Ollama tag;
# doctor rejects a tag that is not present on the configured `base_url`.
aliases:
  phi4: phi4-mini
  qwen36: qwen3.6
  qwen38: qwen3.8
  nemotron: nemotron-3.5-lightning
  gemma: gemma4
  north: north-mini-code
models:
  gemma4:
    provider: ollama
    model: gemma4:31b
    base_url: http://127.0.0.1:1561
    parameter_size: 31B
    availability: local_model_required
    note: Dense, 30.7B total parameters per the Google model card. The local tag does not
      state a quantization, so precision is unrecorded and comparisons against explicitly
      quantized entries carry a precision confound.
  north-mini-code:
    provider: ollama
    model: north-mini-code-1.0:q4_K_M
    base_url: http://127.0.0.1:1561
    parameter_size: 30B
    quantization: q4_K_M
    availability: local_model_required
    note: Mixture of experts, 30B total and 3B active per Cohere. parameter_size records
      total parameters to match the size scatter convention; the 3B active figure is the
      one relevant to throughput. Locally served as a 4-bit quantisation, which is a
      precision confound against the unquantified entries.
  nemotron-3.5-lightning:
    provider: ollama
    model: nemotron-3.5-lightning:30b
    base_url: http://127.0.0.1:1561
    parameter_size: 30B
    availability: local_model_required
  ministral-3:
    provider: ollama
    model: ministral-3:3b
    base_url: http://127.0.0.1:1561
    parameter_size: 3B
    availability: local_model_required
  qwen3.8:
    provider: ollama
    model: qwen3.8:27b
    base_url: http://127.0.0.1:1561
    parameter_size: 27B
    availability: local_model_required
  llama3:
    provider: ollama
    model: llama3:70b
    base_url: http://127.0.0.1:1561
    parameter_size: 70B
    availability: local_model_required
  qwen3.6:
    provider: ollama
    model: qwen3.6:35b
    base_url: http://127.0.0.1:1561
    parameter_size: 35B
    availability: local_model_required
  phi4-mini:
    provider: ollama
    model: phi4-mini:3.8b
    base_url: http://127.0.0.1:1561
    parameter_size: 3.8B
    availability: local_model_required
  gpt-oss:
    provider: ollama
    model: gpt-oss:20b
    base_url: http://127.0.0.1:1561
    parameter_size: 20B
    availability: local_model_required
  mistral:
    provider: ollama
    model: mistral:7b
    base_url: http://127.0.0.1:1561
    parameter_size: 7B
    availability: local_model_required

provider_capabilities:
  ollama:
    credential_env: null
    supported_options: [temperature, max_tokens, seed, top_p, top_k, num_ctx]