schema_version: 1
# Canonical local models. Every `model:` value must match an exact installed Ollama tag;
# doctor rejects a tag that is not present on the configured `base_url`.
aliases:
  phi4: phi4-mini
  qwen36: qwen3.6
  qwen38: qwen3.8
  nemotron: nemotron-3.5-lightning
models:
  nemotron-3.5-lightning:
    provider: ollama
    model: nemotron-3.5-lightning:30b
    base_url: http://127.0.0.1:1561
    parameter_size: 30B
    availability: local_model_required
  ministral-3:
    provider: ollama
    model: ministral-3:3b
    base_url: http://127.0.0.1:1561
    parameter_size: 3B
    availability: local_model_required
  deepseek-r1:
    provider: ollama
    model: deepseek-r1:32b
    base_url: http://127.0.0.1:1561
    parameter_size: 32B
    availability: local_model_required
  qwen3.8:
    provider: ollama
    model: qwen3.8:27b
    base_url: http://127.0.0.1:1561
    parameter_size: 27B
    availability: local_model_required
  llama3:
    provider: ollama
    model: llama3:70b
    base_url: http://127.0.0.1:1561
    parameter_size: 70B
    availability: local_model_required
  qwen3.6:
    provider: ollama
    model: qwen3.6:35b
    base_url: http://127.0.0.1:1561
    parameter_size: 35B
    availability: local_model_required
  phi4-mini:
    provider: ollama
    model: phi4-mini:3.8b
    base_url: http://127.0.0.1:1561
    parameter_size: 3.8B
    availability: local_model_required
  gpt-oss:
    provider: ollama
    model: gpt-oss:20b
    base_url: http://127.0.0.1:1561
    parameter_size: 20B
    availability: local_model_required
  mistral:
    provider: ollama
    model: mistral:7b
    base_url: http://127.0.0.1:1561
    parameter_size: 7B
    availability: local_model_required

provider_capabilities:
  ollama:
    credential_env: null
    supported_options: [temperature, max_tokens, seed, top_p, top_k, num_ctx]